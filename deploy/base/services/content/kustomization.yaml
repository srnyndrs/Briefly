apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
labels:
  - pairs:
      app.kubernetes.io/component: backend
    includeTemplates: true
resources:
  - deployment.yaml
configMapGenerator:
  - name: content-config
    literals:
      - APP_PORT=8002
      - ARTICLE_REQUEST_TIMEOUT_SECONDS=5
      - BLOCKED_TIMEOUT_SECONDS=15

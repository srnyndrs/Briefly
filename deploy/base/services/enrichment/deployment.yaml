apiVersion: v1
kind: Service
metadata:
  name: enrichment-service
  labels:
    app.kubernetes.io/component: backend
spec:
  selector:
    app.kubernetes.io/name: enrichment-service
  ports:
    - name: http
      port: 8005
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: enrichment-service
  labels:
    app.kubernetes.io/component: backend
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: enrichment-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: enrichment-service
        app.kubernetes.io/component: backend
    spec:
      serviceAccountName: briefly
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: enrichment-service
          image: briefly/enrichment-service
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8005
          env:
            - name: SENTRY_DSN
              valueFrom:
                secretKeyRef:
                  name: enrichment-sentry
                  key: SENTRY_DSN
          envFrom:
            - configMapRef:
                name: backend-config
            - configMapRef:
                name: enrichment-config
            - configMapRef:
                name: ollama-model
            - secretRef:
                name: briefly-backend
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 512Mi
          startupProbe:
            httpGet:
              path: /live
              port: http
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 36
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            periodSeconds: 5
            timeoutSeconds: 10
          livenessProbe:
            httpGet:
              path: /live
              port: http
            periodSeconds: 15
            timeoutSeconds: 2
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}

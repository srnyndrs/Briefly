apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../../../config/ollama
  - deployment.yaml
  - ollama.yaml
  - network-policy.yaml
configMapGenerator:
  - name: enrichment-config
    literals:
      - APP_PORT=8005
      - OLLAMA_BASE_URL=http://ollama:11434
      - OLLAMA_TIMEOUT_SECONDS=180

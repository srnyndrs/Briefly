apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
labels:
  - pairs:
      app.kubernetes.io/component: backend
    includeTemplates: true
resources:
  - deployment.yaml
configMapGenerator:
  - name: crawler-config
    literals:
      - APP_PORT=8001
      - CRAWL_INTERVAL_SECONDS=60
      - VERIFIED_CRAWL_INTERVAL_SECONDS=300
      - UNVERIFIED_CRAWL_INTERVAL_SECONDS=1800
      - FETCH_TIMEOUT_SECONDS=30
      - MAX_RETRIES=5

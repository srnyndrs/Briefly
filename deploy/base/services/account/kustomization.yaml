apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
labels:
  - pairs:
      app.kubernetes.io/component: backend
    includeTemplates: true
resources:
  - deployment.yaml
configMapGenerator:
  - name: account-config
    literals:
      - APP_PORT=8003
      - PASSWORD_RESET_URL=http://localhost:3000/reset-password
      - SMTP_HOST=mailpit
      - SMTP_PORT=1025
      - SMTP_USE_TLS=false
      - SMTP_FROM=no-reply@briefly.local

apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
labels:
  - pairs:
      app.kubernetes.io/component: backend
    includeTemplates: true
resources:
  - public-api.yaml
  - account-service.yaml
  - crawler-service.yaml
  - content-service.yaml
  - network-policy.yaml
configMapGenerator:
  - name: backend-config
    literals:
      - APP_HOST=0.0.0.0
      - ENV=development
      - LOG_LEVEL=INFO
      - SENTRY_DSN=
      - SHUTDOWN_TIMEOUT_SECONDS=10
  - name: public-api-config
    literals:
      - APP_PORT=8000
      - ACCOUNT_SERVICE_URL=http://account-service:8003
      - CRAWLER_SERVICE_URL=http://crawler-service:8001
      - CONTENT_SERVICE_URL=http://content-service:8002
      - QUERY_CONSUMER_ENABLED=true
      - REQUEST_TIMEOUT_SECONDS=10
      - SOURCE_DISCOVERY_TIMEOUT_SECONDS=15
  - name: account-config
    literals:
      - APP_PORT=8003
      - PASSWORD_RESET_URL=http://localhost:3000/reset-password
      - SMTP_HOST=mailpit
      - SMTP_PORT=1025
      - SMTP_USE_TLS=false
      - SMTP_FROM=no-reply@briefly.local
  - name: crawler-config
    literals:
      - APP_PORT=8001
      - CRAWL_INTERVAL_SECONDS=60
      - VERIFIED_CRAWL_INTERVAL_SECONDS=300
      - UNVERIFIED_CRAWL_INTERVAL_SECONDS=1800
      - FETCH_TIMEOUT_SECONDS=30
      - MAX_RETRIES=5
  - name: content-config
    literals:
      - APP_PORT=8002
      - ARTICLE_REQUEST_TIMEOUT_SECONDS=5
      - BLOCKED_TIMEOUT_SECONDS=15

[project]
name = "public-api"
version = "0.1.0"
description = "Public gateway API with JWT auth and query projections for Briefly"
authors = [
    { name = "Andras Suranyi" }
]
requires-python = ">=3.13,<4"
dependencies = [
    "fastapi (>=0.135.1,<0.136.0)",
    "uvicorn[standard] (>=0.41.0,<0.42.0)",
    "pydantic (>=2.12.5,<3.0.0)",
    "email-validator (>=2.3.0,<3.0.0)",
    "pydantic-settings (>=2.13.1,<3.0.0)",
    "sqlalchemy (>=2.0.48,<3.0.0)",
    "psycopg2-binary (>=2.9.10,<3.0.0)",
    "authlib (>=1.6.9,<2.0.0)",
    "pika (>=1.3.2,<2.0.0)",
    "httpx (>=0.28.1,<0.29.0)",
    "orjson (>=3.11.7,<4.0.0)"
]

[dependency-groups]
dev = [
    "ruff (>=0.15.6,<0.16.0)",
    "pytest (>=9.0.2,<10.0.0)",
    "pytest-cov (>=7.0.0,<8.0.0)",
    "httpx (>=0.28.1,<0.29.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
package-mode = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 72

[tool.ruff.format]
quote-style = "double"

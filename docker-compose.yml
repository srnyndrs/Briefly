services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: briefly
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d briefly"]
      interval: 5s
      timeout: 5s
      retries: 10

  rabbitmq:
    image: rabbitmq:3-management-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:5672:5672"
      - "127.0.0.1:15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
      - ./config/rabbitmq/definitions.json:/etc/rabbitmq/definitions.json:ro
      - ./config/rabbitmq/rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_port_connectivity"]
      interval: 10s
      timeout: 10s
      retries: 10

  mailpit:
    image: axllent/mailpit:latest
    restart: unless-stopped
    ports:
      - "1025:1025"
      - "8025:8025"

  crawler-service:
    build:
      context: ./services/crawler-service
      dockerfile: Dockerfile
    restart: unless-stopped
    stop_grace_period: 30s
    env_file:
      - path: ./services/crawler-service/.env
        required: false
    ports:
      - "8001:8001"
    environment:
      APP_HOST: 0.0.0.0
      APP_PORT: 8001
      ENV: development
      LOG_LEVEL: INFO
      DATABASE_URL: postgresql+psycopg2://postgres:postgres@postgres:5432/briefly
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/
      FEED_EXCHANGE: feed.content
      VERIFIED_CRAWL_INTERVAL_SECONDS: 300
      UNVERIFIED_CRAWL_INTERVAL_SECONDS: 1800
      CRAWL_INTERVAL_SECONDS: 60
      FETCH_TIMEOUT_SECONDS: 30
      MAX_RETRIES: 5
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8001/health')\""]
      interval: 15s
      timeout: 5s
      start_period: 30s
      retries: 3

  adminer:
    image: adminer:latest
    restart: unless-stopped
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

  content-service:
    build:
      context: ./services/content-service
      dockerfile: Dockerfile
    restart: unless-stopped
    stop_grace_period: 30s
    env_file:
      - path: ./services/content-service/.env
        required: false
    ports:
      - "8002:8002"
    environment:
      APP_HOST: 0.0.0.0
      APP_PORT: 8002
      ENV: development
      LOG_LEVEL: INFO
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/
      FEED_EXCHANGE: feed.content
      PARSED_EXCHANGE: content.parsed
      ARTICLE_REQUEST_TIMEOUT_SECONDS: 5
      BLOCKED_TIMEOUT_SECONDS: 15
      DATABASE_URL: postgresql+psycopg2://postgres:postgres@postgres:5432/briefly
    depends_on:
      rabbitmq:
        condition: service_healthy
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8002/health')\""]
      interval: 15s
      timeout: 5s
      start_period: 30s
      retries: 3

  enrichment-service:
    profiles: ["enrichment"]
    build:
      context: ./services/enrichment-service
      dockerfile: Dockerfile
    restart: unless-stopped
    stop_grace_period: 30s
    env_file:
      - path: ./services/enrichment-service/.env
        required: false
      - ./config/ollama/model.env
    ports:
      - "8005:8005"
    environment:
      APP_HOST: 0.0.0.0
      APP_PORT: 8005
      ENV: development
      LOG_LEVEL: INFO
      DATABASE_URL: postgresql+psycopg2://postgres:postgres@postgres:5432/briefly
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/
      OLLAMA_BASE_URL: http://ollama:11434
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      ollama:
        condition: service_healthy
      public-api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8005/health')\""]
      interval: 15s
      timeout: 5s
      start_period: 30s
      retries: 3

  ollama:
    profiles: ["enrichment", "ollama"]
    image: ollama/ollama@sha256:292ee7945dfc3d5840a181f3ab86fedb1e66703e02c8af98b50f4da56b7e278c
    entrypoint: ["sh", "/etc/ollama/start.sh"]
    restart: unless-stopped
    env_file:
      - ./config/ollama/model.env
    ports:
      - "127.0.0.1:11434:11434"
    environment:
      OLLAMA_HOST: 0.0.0.0:11434
      OLLAMA_MODELS: /models
      OLLAMA_NOPRUNE: "true"
    volumes:
      - ollama_data:/models
      - ./config/ollama/start.sh:/etc/ollama/start.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "ollama show \"$${OLLAMA_MODEL}\" >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      start_period: 15m
      retries: 5

  account-service:
    build:
      context: ./services/account-service
      dockerfile: Dockerfile
    restart: unless-stopped
    stop_grace_period: 30s
    env_file:
      - path: ./services/account-service/.env
        required: false
    ports:
      - "8003:8003"
    environment:
      APP_HOST: 0.0.0.0
      APP_PORT: 8003
      ENV: development
      LOG_LEVEL: INFO
      DATABASE_URL: postgresql+psycopg2://postgres:postgres@postgres:5432/briefly
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/
      ACCOUNT_EXCHANGE: account.events
      JWT_SECRET: local-dev-secret-change-me
      JWT_ISSUER: briefly-account-service
      JWT_AUDIENCE: briefly-public-api
      ACCESS_TOKEN_TTL_SECONDS: 900
      REFRESH_TOKEN_TTL_SECONDS: 2592000
      PASSWORD_RESET_URL: http://localhost:3000/reset-password
      SMTP_HOST: mailpit
      SMTP_PORT: 1025
      SMTP_USE_TLS: "false"
      SMTP_FROM: no-reply@briefly.local
    depends_on:
      rabbitmq:
        condition: service_healthy
      postgres:
        condition: service_healthy
      mailpit:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8003/health')\""]
      interval: 15s
      timeout: 5s
      start_period: 30s
      retries: 3

  public-api:
    build:
      context: ./services/public-api
      dockerfile: Dockerfile
    restart: unless-stopped
    stop_grace_period: 30s
    env_file:
      - path: ./services/public-api/.env
        required: false
    ports:
      - "8000:8000"
    environment:
      APP_HOST: 0.0.0.0
      APP_PORT: 8000
      ENV: development
      LOG_LEVEL: INFO
      DATABASE_URL: postgresql+psycopg2://postgres:postgres@postgres:5432/briefly
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/
      ACCOUNT_EXCHANGE: account.events
      CONTENT_EXCHANGE: content.parsed
      QUERY_QUEUE: public-api.query.v1
      QUERY_CONSUMER_ENABLED: "true"
      JWT_SECRET: local-dev-secret-change-me
      JWT_ISSUER: briefly-account-service
      JWT_AUDIENCE: briefly-public-api
      ACCOUNT_SERVICE_URL: http://account-service:8003
      CRAWLER_SERVICE_URL: http://crawler-service:8001
      CONTENT_SERVICE_URL: http://content-service:8002
      REQUEST_TIMEOUT_SECONDS: 10
      SOURCE_DISCOVERY_TIMEOUT_SECONDS: 15
    depends_on:
      rabbitmq:
        condition: service_healthy
      postgres:
        condition: service_healthy
      account-service:
        condition: service_healthy
      crawler-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health')\""]
      interval: 15s
      timeout: 5s
      start_period: 30s
      retries: 3

volumes:
  postgres_data:
  rabbitmq_data:
  ollama_data:

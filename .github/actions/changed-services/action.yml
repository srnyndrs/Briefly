name: List changed backend services
description: Detect and list backend services affected by changes.

outputs:
  services:
    description: JSON array of changed backend service names.
    value: ${{ steps.filter.outputs.changes }}

runs:
  using: composite
  steps:
    - name: Filter Paths
      uses: dorny/paths-filter@v3
      id: filter
      with:
        base: ${{ github.ref }}
        filters: |
          account-service:
            - 'services/account-service/**'
            - '.github/actions/publish-image/**'
          content-service:
            - 'services/content-service/**'
            - '.github/actions/publish-image/**'
          crawler-service:
            - 'services/crawler-service/**'
            - '.github/actions/publish-image/**'
          enrichment-service:
            - 'services/enrichment-service/**'
            - '.github/actions/publish-image/**'
          public-api:
            - 'services/public-api/**'
            - '.github/actions/publish-image/**'

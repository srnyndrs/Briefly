name: Publish backend service image
description: Build and publish a service image to GitHub Container Registry

inputs:
  service:
    description: Service name
    required: true

runs:
  using: composite
  steps:
    - name: Set up Docker QEMU
      uses: docker/setup-qemu-action@v4.2.0

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v4.1.0

    - name: Log in to GitHub Container Registry
      uses: docker/login-action@v4
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ github.token }}

    - name: Set image reference
      id: image
      shell: bash
      env:
        SERVICE: ${{ inputs.service }}
      run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}/${SERVICE}" >> "$GITHUB_OUTPUT"

    - name: Build and push image
      id: build
      uses: docker/build-push-action@v7.4.0
      with:
        context: services/${{ inputs.service }}
        platforms: linux/amd64,linux/arm64
        push: true
        tags: ${{ steps.image.outputs.name }}:sha-${{ github.sha }}
        labels: |
          org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
        cache-from: type=gha,scope=${{ inputs.service }}
        cache-to: type=gha,scope=${{ inputs.service }},mode=max

    - name: Report published image
      shell: bash
      env:
        IMAGE: ${{ steps.image.outputs.name }}:sha-${{ github.sha }}
        DIGEST: ${{ steps.build.outputs.digest }}
      run: 'echo "Published image: `${IMAGE}@${DIGEST}`" >> "$GITHUB_STEP_SUMMARY"'

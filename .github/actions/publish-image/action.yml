name: Publish backend service image
description: Build and publish a service image to GitHub Container Registry

inputs:
  service:
    description: Service name
    required: true

runs:
  using: composite
  steps:
    - name: Set up Docker QEMU
      uses: docker/setup-qemu-action@v4.2.0

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v4.1.0

    - name: Log in to GitHub Container Registry
      uses: docker/login-action@v4
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ github.token }}

    - name: Image metadata
      id: meta
      uses: docker/metadata-action@v6.2.0
      with:
        images: ghcr.io/${{ github.repository }}/${{ inputs.service }}
        tags: |
          type=sha,format=long
          type=ref,event=branch

    - name: Build and push image
      uses: docker/build-push-action@v7.4.0
      with:
        context: services/${{ inputs.service }}
        platforms: linux/amd64,linux/arm64
        push: true
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        cache-from: type=gha,scope=${{ inputs.service }}
        cache-to: type=gha,scope=${{ inputs.service }},mode=max

name: CI and image publishing

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  select:
    name: Select services
    runs-on: ubuntu-latest
    outputs:
      services: ${{ steps.all.outputs.services || steps.detect.outputs.services }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select all backend services for manual run
        if: github.event_name == 'workflow_dispatch'
        id: all
        run: |
          echo 'services=["account-service","content-service","crawler-service","enrichment-service","public-api"]' >> "$GITHUB_OUTPUT"

      - name: Detect changed services
        if: github.event_name != 'workflow_dispatch'
        id: detect
        uses: ./.github/actions/changed-services

  quality:
    name: Check selected services
    needs: select
    if: needs.select.outputs.services != '[]'
    uses: ./.github/workflows/code-quality.yml
    with:
      services: ${{ needs.select.outputs.services }}

  publish:
    name: Publish ${{ matrix.service }}
    needs: [select, quality]
    if: needs.select.outputs.services != '[]' && (github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/heads/release/'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJSON(needs.select.outputs.services) }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Publish image
        uses: ./.github/actions/publish-image
        with:
          service: ${{ matrix.service }}

name: CI and image publishing

on:
  push:

permissions:
  contents: read

jobs:
  select:
    name: Select services
    runs-on: ubuntu-latest
    outputs:
      services: ${{ steps.detect.outputs.services }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Detect changed services
        id: detect
        uses: ./.github/actions/changed-services

  quality:
    name: Check selected services
    needs: select
    if: needs.select.outputs.services != '[]'
    uses: ./.github/workflows/code-quality.yml
    with:
      services: ${{ needs.select.outputs.services }}

  publish:
    name: Publish ${{ matrix.service }}
    needs: [select, quality]
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJSON(needs.select.outputs.services) }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Publish image
        uses: ./.github/actions/publish-image
        with:
          service: ${{ matrix.service }}
